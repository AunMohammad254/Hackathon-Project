services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/clinic-saas
      - JWT_SECRET=${JWT_SECRET}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_KEY=${SUPABASE_KEY}
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api/v1
    depends_on:
      - backend

  ai-assistant:
    build:
      context: .
      dockerfile: ai-assistant.Dockerfile
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - TERM=xterm-256color
      - COLORTERM=truecolor
    volumes:
      - .:/workspace
    working_dir: /workspace
    command: tail -f /dev/null

volumes:
  mongodb_data:
